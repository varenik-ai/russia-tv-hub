<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Русское ТВ — приёмник</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
video{background:#000}
#msg{position:fixed;left:0;right:0;bottom:7%;text-align:center;color:#d8d8e8;font-size:3.2vh;text-shadow:0 0 8px #000;padding:0 6%}
#msg b{display:block;font-size:4.4vh;margin-bottom:.6vh}
</style></head><body>
<div id="stage"><video id="v" autoplay playsinline></video></div>
<div id="msg"><b>Русское ТВ</b>Выберите канал на телефоне</div>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
/* Приёмник Google Cast для russian-tv.com (19.11.2026). Зачем: стандартный приёмник Chromecast игнорирует метку формата пикселя (SAR) в видео,
   и каналы 720x576 с «широким» кадром (СТС, РЕН ТВ, Пятница!) показываются как 4:3. Здесь поток играет hls.js, а кадр вписывается в рамку
   с нужным соотношением сторон (object-fit: fill), поэтому картинка 16:9 остаётся 16:9 независимо от того, учёл декодер SAR или нет.
   Телефон шлёт сообщение {cmd:'play', url, name} в пространство имён NS (sendMessage в cast.js и player-ui.js), стоп — завершение сеанса.
   Проверка без телевизора: /receiver?url=<плейлист>&dar=1.7778 */
(function () {
  var NS = 'urn:x-cast:com.russian-tv.cast';
  var v = document.getElementById('v'), msg = document.getElementById('msg'), hls = null, dar = 0, cur = '';
  /* соотношение сторон кадра по каналу (идентификатор берётся из адреса /stream?channel=ID); нет в списке — как в потоке */
  var DAR = { sts: 16 / 9, rentv: 16 / 9, pyatnica: 16 / 9 };
  function say(t, sub) { msg.style.display = t ? 'block' : 'none'; msg.innerHTML = t ? ('<b></b>') : ''; if (t) { msg.firstChild.textContent = t; if (sub) msg.appendChild(document.createTextNode(sub)); } }
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    if (!dar) { v.style.width = '100%'; v.style.height = '100%'; v.style.objectFit = 'contain'; return; }
    var bw = W, bh = W / dar; if (bh > H) { bh = H; bw = H * dar; }
    v.style.width = bw + 'px'; v.style.height = bh + 'px'; v.style.objectFit = 'fill';
  }
  window.addEventListener('resize', layout);
  function channelOf(u) { try { return new URL(u, location.href).searchParams.get('channel') || ''; } catch (e) { return ''; } }
  function stop() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } try { v.removeAttribute('src'); v.load(); } catch (e) {} }
  function play(url, name, forceDar) {
    if (!url) return;
    stop(); cur = url; dar = forceDar || DAR[channelOf(url)] || 0; layout();
    say(name || 'Русское ТВ', 'Загрузка…');
    v.onplaying = function () { say(''); };
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: false, maxBufferLength: 20, manifestLoadingMaxRetry: 3, levelLoadingMaxRetry: 3, fragLoadingMaxRetry: 4 });
      hls.loadSource(url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); });
      hls.on(Hls.Events.ERROR, function (e, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { say(name || 'Русское ТВ', 'Нет связи с потоком, пробую снова…'); setTimeout(function () { if (hls) hls.startLoad(); }, 2000); }
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
        else { say(name || 'Русское ТВ', 'Не удалось запустить канал'); }
      });
    } else {
      v.src = url; var p = v.play(); if (p && p.catch) p.catch(function () {});
    }
  }
  /* проверка в обычном браузере */
  var q = new URLSearchParams(location.search);
  if (q.get('url')) { play(q.get('url'), q.get('name') || '', parseFloat(q.get('dar') || '0') || 0); }
  /* Cast */
  try {
    if (window.cast && cast.framework) {
      var ctx = cast.framework.CastReceiverContext.getInstance();
      var opts = new cast.framework.CastReceiverOptions();
      opts.customNamespaces = {}; opts.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
      opts.disableIdleTimeout = true;
      ctx.addCustomMessageListener(NS, function (ev) {
        var d = ev && ev.data; if (!d) return;
        if (d.cmd === 'play') { if (d.url === cur && hls) return; play(d.url, d.name, d.dar ? parseFloat(d.dar) : 0); }
        else if (d.cmd === 'stop') { stop(); say('Русское ТВ', 'Выберите канал на телефоне'); }
      });
      ctx.start(opts);
    }
  } catch (e) {}
})();
</script></body></html>
