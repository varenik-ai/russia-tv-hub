<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Россия ТВ Live</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { background:#0a0a14; height:100%; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:white; overflow:hidden; touch-action:pan-x pan-y pinch-zoom; }

    /* ── Hub ── */
    #hub-screen { display:flex; flex-direction:column; align-items:center; height:100%; overflow-y:auto; padding:24px 16px 40px; padding-top:calc(24px + max(var(--tg-safe-top,0px), env(safe-area-inset-top,0px))); }
    .hub-logo { font-size:26px; font-weight:900; letter-spacing:2px; margin-bottom:4px; text-transform:uppercase; }
    .hub-logo .red   { color:#D52B1E; }
    .hub-logo .white { color:white; }
    .hub-logo .blue  { color:#003F8F; }
    .hub-sub { font-size:13px; color:#555; margin-bottom:24px; }
    .channels-grid { width:100%; max-width:560px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

    .category-header { grid-column:1/-1; font-size:11px; font-weight:700; color:#444; text-transform:uppercase; letter-spacing:2px; padding:6px 4px 2px; margin-top:6px; }

    .channel-card { background:#1a1a28; border:1px solid #2a2a3a; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; min-width:0; }
    .channel-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:4px 0 0 4px; background:var(--ch-color,#555); }
    .channel-card:active { opacity:.75; transform:scale(.98); }
    .ch-icon { width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
    .ch-icon.ch-logo { background:#0e0e18 !important; padding:6px; box-sizing:border-box; }
    .ch-icon.ch-logo img { width:100%; height:100%; object-fit:contain; display:block; }
    .site-link-btn { background:linear-gradient(135deg,#ff9800,#f4511e) !important; font-weight:800 !important; box-shadow:0 2px 10px rgba(244,81,53,.5); }
    /* v82.24: ТНТ — источника с открытым CORS нет ни у нас, ни у конкурентов
       (у всех либо DRM/access-контроль, либо официальный iframe-embed
       Одноклассников). Показываем тот же официальный embed, что и
       конкуренты — это чужой плеер OK.ru внутри рамки, без наших кастомных
       кнопок (они ему не нужны, OK.ru отдаёт свои элементы управления). */
    #channel-iframe { position:absolute; inset:0; width:100%; height:100%; border:0; z-index:2; display:none; background:#000; }
    .ch-info { flex:1; min-width:0; }
    .ch-name { font-size:14px; font-weight:700; white-space:normal; line-height:1.25; }
    .live-dot { width:8px; height:8px; background:var(--ch-color,#555); border-radius:50%; animation:pulse 1.2s infinite; flex-shrink:0; }

    /* ── Player ── */
    #player-screen { display:none; flex-direction:column; align-items:center; height:100%; }
    .player-header { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; overflow:hidden;
      padding-top:calc(10px + max(var(--tg-safe-top,0px), env(safe-area-inset-top,0px)));
      padding-right:calc(14px + var(--tg-safe-right,0px));
      padding-bottom:10px;
      padding-left:calc(14px + var(--tg-safe-left,0px));
      background:#0d0d1a; border-bottom:1px solid #1e1e2e; flex-shrink:0; }
    .ch-title-bar { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Кнопка "← Каналы" переехала в нижнюю панель управления (.controls) —
       в верхней шапке она перекрывалась плавающей кнопкой "Закрыть" от Telegram
       в полноэкранном режиме на iOS (та кнопка рисуется поверх контента и может
       быть шире/у́же в зависимости от языка и устройства, надёжно её не обойти). */
    .btn.channels-btn { background:linear-gradient(135deg,#1565c0,#0d47a1); font-weight:700; order:-1; }
    .ch-title-bar { font-size:15px; font-weight:700; }
    .live-badge-top { color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:6px; display:none; }

    /* ── Video ── */
    #video-container { width:100%; flex:1; background:#000; position:relative; overflow:visible; touch-action:pinch-zoom; }
    #video-container.css-fs { position:fixed !important; inset:0 !important; width:100vw !important; height:100vh !important; z-index:9999 !important; }
    #video-container.css-fs .live-badge,
    #video-container:fullscreen .live-badge,
    #video-container:-webkit-full-screen .live-badge { display:none !important; }
    #video-container.css-fs .overlay { display:none !important; }
    #video-container:fullscreen .overlay,
    #video-container:-webkit-full-screen .overlay { display:none !important; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; }
    audio { display:none; }

    .live-badge { position:absolute; top:14px; left:14px; color:white; font-size:13px; padding:5px 12px; border-radius:30px; display:none; align-items:center; gap:6px; font-weight:700; z-index:25; background:rgba(213,43,30,.9); }
    #audio-badge { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:3; pointer-events:none; background:rgba(0,0,0,.85); }
    #audio-badge .pill { padding:14px 20px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); font-size:15px; }
    body.audio-only #audio-badge { display:flex; }
    body.audio-only video { opacity:.02; }

    .overlay { position:absolute; inset:0; z-index:20; pointer-events:none; transition:opacity .5s ease; }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .controls { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.92)); padding:28px 14px; pointer-events:all; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .btn { padding:12px 18px; color:white; border:none; border-radius:10px; font-size:14px; cursor:pointer; transition:all .2s; flex:1; max-width:160px; background:rgba(255,255,255,.12); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); }
    .btn:active { transform:scale(.96); }
    .btn.danger { background:#D52B1E; }
    .btn.reload { background:#333; }

    #status { font-size:13px; color:#888; text-align:center; padding:8px 0 0; flex-shrink:0; }
    .dot { display:inline-block; width:8px; height:8px; background:#D52B1E; border-radius:50%; margin-right:6px; animation:pulse 1.2s infinite; vertical-align:middle; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }
  </style>
</head>
<body>

<div id="hub-screen">
  <div class="hub-logo"><span class="white">РОС</span><span class="blue">СИЯ</span><span class="red">·ТВ</span></div>
  <div class="hub-sub">Прямой эфир — Бесплатно — 24/7</div>
  <div class="channels-grid" id="channels-grid"></div>
</div>

<div id="player-screen">
  <div class="player-header">
    <span class="ch-title-bar" id="ch-title"></span>
    <span class="live-badge-top" id="live-badge-top">LIVE</span>
  </div>
  <div id="video-container">
    <div class="live-badge" id="live-badge"><span class="dot"></span> ПРЯМОЙ ЭФИР</div>
    <div id="audio-badge"><div class="pill">🎧 Аудио режим</div></div>
    <video id="video" autoplay playsinline webkit-playsinline airplay="allow" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;"></video>
    <iframe id="channel-iframe" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div class="overlay" id="overlay">
      <div class="controls">
        <button id="back-btn" class="btn channels-btn"></button>
        <button id="reload-btn" class="btn reload" style="display:none"></button>
        <button id="unmute-btn" class="btn danger" style="display:none"></button>
        <button id="mode-btn" class="btn"></button>
        <button id="fullscreen-btn" class="btn"></button>
        <button id="pip-btn" class="btn" style="display:none"></button>
        <button id="site-link-btn" class="btn site-link-btn">🌐 Смотреть на сайте</button>
      </div>
    </div>
    <audio id="audio-bg" muted></audio>
  </div>
  <div id="status">...</div>
</div>

<script>
const tg = window.Telegram?.WebApp;

// ── Safe area ──────────────────────────────────────────────────────────────
function updateSafeArea() {
  const inFs = document.fullscreenElement || tg?.isFullscreen;
  const csa = tg?.contentSafeAreaInsets || {};
  const sa  = tg?.safeAreaInsets || {};
  // В полноэкранном режиме Telegram рисует свою плавающую кнопку "Закрыть"
  // поверх контента (не резервируя место через layout) — если сам Telegram
  // не прислал реальные contentSafeAreaInsets, подстраховываемся своими
  // отступами, чтобы наша кнопка "← Каналы" не оказалась под ней.
  const topReal   = csa.top    || sa.top    || 0;
  const leftReal  = csa.left   || sa.left   || 0;
  const rightReal = csa.right  || sa.right  || 0;
  // По скриншоту с iPhone: капсула "✕ Закрыть" слева доходит примерно до 25%
  // ширины экрана, а шеврон+меню "···" справа занимают примерно 20% ширины —
  // старых 54px хватало не всегда, увеличили запас с обеих сторон.
  const top   = topReal   > 0 ? topReal   : (inFs ? 56  : 0);
  const left  = leftReal  > 0 ? leftReal  : (inFs ? 104 : 0);
  const right = rightReal > 0 ? rightReal : (inFs ? 88  : 0);
  document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
  document.documentElement.style.setProperty('--tg-safe-left', left + 'px');
  document.documentElement.style.setProperty('--tg-safe-right', right + 'px');
}
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch(e) {}
  try { tg.setHeaderColor('#000000'); } catch(e) {}
  try { tg.setBackgroundColor('#000000'); } catch(e) {}
  if (isAndroid() || isIOS()) setTimeout(() => { try { tg.requestFullscreen(); } catch(e) {} }, 300);
  try { tg.onEvent('safeAreaChanged', updateSafeArea); } catch(e) {}
  try { tg.onEvent('contentSafeAreaChanged', updateSafeArea); } catch(e) {}
  setTimeout(updateSafeArea, 500);
}

// ── Определение платформы ──────────────────────────────────────────────────
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
    || window.Telegram?.WebApp?.platform === 'ios';
}
function isAndroid() { return /Android/i.test(navigator.userAgent); }

// ── Каналы ────────────────────────────────────────────────────────────────
const PROXY = 'https://stream.russian-tv.com';

// v82.14: ротация резервных прокси — на сайте (russian-tv.com) это уже есть
// и решает как раз ту разницу в надёжности "на сайте работает, в мини-аппе
// нет": при сбое основного Worker'а (rate limit, временный сетевой сбой,
// краевой узел Cloudflare и т.п.) плеер сайта автоматически переключается
// на резервный, а мини-апп раньше был жёстко привязан к одному URL без
// какого-либо резерва. Список тот же, что на сайте (/proxy.json).
// v82.27: пользователь сообщил, что Первый канал заводится только после
// двух переключений (т.е. первые 2 прокси в списке не срабатывают с
// первой попытки, а третий — стабильно). Переставил birch-creek первым.
var PROXIES = ['https://birch-creek.dyaltd.workers.dev', 'https://stream.russian-tv.com', 'https://oak-valley.dyaltd.workers.dev'];
var _proxyIdx = 0;
var _proxyFailedAt = {};
function _currentProxy() { return PROXIES[_proxyIdx % PROXIES.length]; }
function _markProxyFailed() { _proxyFailedAt[_proxyIdx % PROXIES.length] = Date.now(); }
function _advanceProxy() {
  for (var i = 1; i <= PROXIES.length; i++) {
    var idx = (_proxyIdx + i) % PROXIES.length;
    var failedAt = _proxyFailedAt[idx];
    if (!failedAt || Date.now() - failedAt > 90000) { _proxyIdx += i; return; }
  }
  _proxyIdx++;
}
function _streamUrl(ch) { return _currentProxy() + '/stream?channel=' + ch.id; }

// v82.15: логотипы — 1-в-1 как на сайте (russian-tv.com): там, где у сайта
// есть настоящая картинка логотипа (assets/logos/*.svg или smotret.tv), она
// указана в поле `logo`; остальные каналы — на сайте у них тоже только
// цветная текстовая плашка, поэтому здесь она и остаётся (это не расхождение
// с сайтом, а тот же самый fallback). `slug` — путь канала на russian-tv.com
// для кнопки "Смотреть на сайте".

      { id:'rossiya24', name:'Россия 24',   desc:'Новости круглосуточно',       icon:'Р24', color:'#1565c0', iconBg:'#0a0f1a', logo:SITE+'/assets/logos/rossiya24.svg',           slug:'rossiya-24-live',    stream: PROXY+'/stream?channel=rossiya24' },
      { id:'pyatyy',    name:'Пятый канал', desc:'Новости и публицистика',      icon:'5',   color:'#1976d2', iconBg:'#0a0f1a', logo:SITE+'/assets/logos/pyatyy.svg',              slug:'pyatyy-kanal-live',  stream: PROXY+'/stream?channel=pyatyy' },
      { id:'tvc',       name:'ТВЦ',         desc:'Московское телевидение',      icon:'ТВЦ', color:'#37474f', iconBg:'#0a0f12', logo:'https://smotret.tv/images/logo-tv-centr.svg', slug:'tv-centr-live',     stream: PROXY+'/stream?channel=tvc' },
      { id:'mir',       name:'МИР',         desc:'СНГ — межгосударственное ТВ', icon:'МИР', color:'#0288d1', iconBg:'#0a1018', logo:'https://smotret.tv/images/logo-mir.svg',      slug:'mir-live',          stream: PROXY+'/stream?channel=mir' },

      { id:'ch360',     name:'360°',         desc:'Новости Подмосковья',         icon:'360', color:'#1565c0', iconBg:'#080d1a', slug:'kanal-360-live', stream: PROXY+'/stream?channel=ch360' },
      { id:'moskva24',  name:'Москва 24',    desc:'Новости и жизнь столицы',     icon:'М24', color:'#e53935', iconBg:'#1a0808', stream: PROXY+'/stream?channel=moskva24' },

  {

    channels: [
      // v82.29: ОТКАТ iframe-embed OK.ru для ТНТ4 и ТНТ (v82.24/v82.28) —
      // пользователь сообщил "видео недоступно для региона". OK.ru
      // встраивает СВОЙ плеер с гео-блокировкой по IP зрителя (обычно
      // Россия/СНГ) — это ограничение самого OK.ru, зависит от того, откуда

      { id:'nasheKino',    name:'Наше кино',        desc:'Новое российское кино',    icon:'НК',  color:'#c62828', iconBg:'#180808', slug:'nashe-kino-live', stream: PROXY+'/stream?channel=nasheKino' },
      { id:'rodnoeKino',   name:'Родное кино',      desc:'Отечественное кино',       icon:'РК',  color:'#ad1457', iconBg:'#180810', slug:'rodnoe-kino-live', stream: PROXY+'/stream?channel=rodnoeKino' },

      { id:'kinodetektiv', name:'Кино Детектив',    desc:'Детективы и триллеры 24/7', icon:'ДТК', color:'#546e7a', iconBg:'#0c1216', slug:'kino-detektiv-live', stream: PROXY+'/stream?channel=kinodetektiv' },
      { id:'kinoekshn',    name:'Кино Экшн',        desc:'Боевики и экшн 24/7',      icon:'ЭКШ', color:'#d84315', iconBg:'#1a0d08', slug:'kino-ekshn-live', stream: PROXY+'/stream?channel=kinoekshn' },
    ]
  },
  {
    label: '👶 Детские',
    channels: [
      { id:'karusel',  name:'Карусель',    desc:'Для малышей и детей', icon:'КАР', color:'#ff6f00', iconBg:'#1a1200', logo:'https://smotret.tv/images/logo-karusel.svg', slug:'karusel-live', stream: PROXY+'/stream?channel=karusel' },
      { id:'mult',     name:'Мульт',       desc:'Мультфильмы 24/7',    icon:'МЛТ', color:'#ff8f00', iconBg:'#1a1400', slug:'mult-live', stream: PROXY+'/stream?channel=mult' },
    ]
  },
  {

  if (_nativeErrorHandler) { video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null; }
  if (_nativeMetaHandler) { video.removeEventListener('loadedmetadata', _nativeMetaHandler); _nativeMetaHandler = null; }
  video.src='';
  // v82.19: раньше не вызывали video.load() после сброса src — при быстром
  // переключении каналов (типичное поведение зрителя, листающего список)
  // предыдущий MediaSource иногда не успевал полностью отвязаться от
  // <video> до того, как hls.js следующего канала пытался прикрепить свой
  // новый MediaSource — элемент оставался в "подвисшем" состоянии и
  // следующий канал не запускался (readyState вечно 0, без единой
  // hls.js-ошибки). video.load() принудительно и синхронно сбрасывает
  // состояние элемента перед следующим attachMedia().
  try { video.load(); } catch(e) {}
  liveBadge.style.display='none'; liveBadgeTop.style.display='none';
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel=null; }
}

function loadStream(url) {
  if (!currentCh) return;
  userUnmuted=false;
  const streamUrl = url;
  stopStream(); setStatus('connecting'); unmuteBtn.style.display='none';
  _lastProgressTime = Date.now(); _lastVideoTime = 0; _sessionStart = Date.now();
  _lastFrameCount = 0; _lastFrameProgressTime = Date.now();

  // Web Worker внутри WebView Telegram (особенно старые версии Android/Desktop
  // клиента) нередко не даёт hls.js создать воркер через blob: URL — тогда
  // инициализация HLS тихо зависает без единой fatal-ошибки, и канал просто
  // не запускается. В браузере (сайт) это не проявляется, поэтому в мини-аппе
  // воркер отключаем принудительно — так надёжнее почти во всех WebView.
  const HLS_WORKER_SAFE = false;

  // Буфер и дистанция от "живого края" (v82.10.1): у части источников
  // fs.uplink.kz (Кинoсвидание, Viju и др.) сегменты либо тяжёлые (Кино-
  // свидание — ~5 Мбит/с при таргет-длительности 6с — на мобильной сети
  // тонкий буфер съедается за пару секунд и картинка замирает), либо
  // источник иногда отдаёт в плейлисте самый свежий сегмент чуть раньше,
  // чем реально успевает его записать (Viju — периодические 404 на
  // последнем сегменте плейлиста), что при lowLatencyMode + маленьком
  // liveSyncDurationCount ловится как ошибка загрузки фрагмента и
  // выглядит как фриз. Раньше держались близко к живому краю ради
  // минимальной задержки — но для обычного (не Low-Latency) HLS-источника
  // с собственной внутренней задержкой ~20-30с это не даёт выигрыша,
  // только хрупкость. Теперь держим больший запас и буфер.
  const HLS_BUFFER_OPTS = {
    liveSyncDurationCount: 6,   // не подходим к самому краю — источник иногда ещё не дописал последний сегмент
    lowLatencyMode: false,      // источники не LL-HLS — этот режим только уменьшал буфер без выигрыша в задержке
    maxBufferLength: 30,        // сек буфера вперёд — гасит джиттер сети/тяжёлые сегменты
    maxMaxBufferLength: 60,
    fragLoadingMaxRetry: 6,
    fragLoadingRetryDelay: 500,
    manifestLoadingMaxRetry: 4,
    // v82.10.2: у части каналов (Первый и др.) источник отдаёт несколько
    // уровней качества (например, 240p/360p/576p у thestream.cyou), и ABR
    // hls.js периодически переключается между ними, обрывая уже начатую
    // загрузку фрагмента ("networkError aborted") — именно это ощущается
    // как короткие частые фризы. На маленьком экране мини-аппа 576p не
    // даёт видимого выигрыша, только лишний риск нехватки полосы. Ограничив
    // выбор уровня реальным размером плеера и стартуя с низкого — ABR
    // перестаёт скакать между уровнями почти всегда.
    capLevelToPlayerSize: true,
    startLevel: 0,
    abrEwmaDefaultEstimate: 500000, // старт с пессимистичной оценки полосы — не пытаемся сразу хватать 576p
  };

  if (isAndroid()) {
    const audioBg = document.getElementById('audio-bg');
    if (audioBg && Hls.isSupported()) {
      hlsAudio = new Hls({ ...HLS_BUFFER_OPTS, enableWorker:HLS_WORKER_SAFE });
      hlsAudio.loadSource(streamUrl); hlsAudio.attachMedia(audioBg);
      hlsAudio.on(Hls.Events.MANIFEST_PARSED, () => { audioBg.muted=true; audioBg.play().catch(()=>{}); });
    }
  }

  video.muted=true;
  if (Hls.isSupported()) {
    hls = new Hls({ ...HLS_BUFFER_OPTS, enableWorker:HLS_WORKER_SAFE, backBufferLength:30 });
    hls.loadSource(streamUrl); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, async () => {
      setStatus('live'); liveBadge.style.display='flex'; liveBadgeTop.style.display='inline';
      try {
        if (!userUnmuted) video.muted=true;
        await video.play();
        unmuteBtn.style.display = audioOnly ? 'none' : 'block';
        setupMediaSession();
        if (!isIOS()) requestWakeLock();
      } catch(e) { setStatus('pressPlay'); }
    });
    let _fatalNetErrCount = 0;
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (!data.fatal) return;
      if (data.type===Hls.ErrorTypes.NETWORK_ERROR) {
        // v82.14: раньше просто дёргали startLoad() на том же прокси —
        // если сам прокси/источник реально сломан (не разовый сбой),
        // получали бесконечный цикл ошибок на нём же. После 2 подряд
        // фатальных сетевых ошибок переключаемся на резервный прокси.
        _fatalNetErrCount++;
        if (_fatalNetErrCount >= 2) {
          _fatalNetErrCount = 0;
          _markProxyFailed(); _advanceProxy();
          setStatus('connecting'); setTimeout(() => init(), 1000);
          return;
        }
        try{hls.startLoad();}catch(err){} return;
      }
      if (data.type===Hls.ErrorTypes.MEDIA_ERROR)   { try{hls.recoverMediaError();}catch(err){} return; }
      _markProxyFailed(); _advanceProxy();
      setStatus('errorStream', true); setTimeout(() => init(), 3000);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Нативный путь (Safari/iOS — hls.js сам уступает браузеру со встроенной
    // поддержкой HLS). ВАЖНО (v82.12): раньше здесь не было НИКАКОЙ обработки
    // ошибок — если поток не грузился (а у части источников бывают разовые
    // сбои на первой попытке: свежий сегмент ещё не записан, редирект,
    // нестрогое соответствие плейлиста спеке — AVPlayer к этому строже, чем
    // hls.js), статус навсегда зависал на "Подключение..." без единой
    // попытки переподключиться. Именно это, похоже, и объясняло "большинство
    // каналов не играет" именно на iPhone — на десктопе тот же код идёт
    // через hls.js веткой выше, у которой ретраи есть. Добавлены: обработчик
    // 'error' на видео + watchdog по таймауту, если воспроизведение не
    // началось за разумное время.
    // v82.13: v82.12 добавил сюда addEventListener('error', ..., {once:true}),
    // но если канал стартовал успешно (сработал 'loadedmetadata'), сам
    // обработчик error НИКОГДА не срабатывал и НИКОГДА не снимался — оставался
    // висеть на общем `video`-элементе навсегда. При каждом переключении
    // канала stopStream() делает video.src='', что само по себе генерирует
    // событие 'error' — и ВСЕ накопленные с прошлых каналов обработчики
    // срабатывали одновременно при следующем же переключении, наперебой
    // вызывая init() и ломая последующую загрузку. Чем больше каналов
    // переключили — тем хуже. Теперь обработчики именованные и снимаются
    // явно в обеих ветках (успех/ошибка), плюс на каждый заход в
    // native-ветку сперва снимаются обработчики от предыдущего захода.
    if (_nativeErrorHandler) { video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null; }
    if (_nativeMetaHandler) { video.removeEventListener('loadedmetadata', _nativeMetaHandler); _nativeMetaHandler = null; }
    let nativeStarted = false;
    const nativeTimeout = setTimeout(() => {
      // v82.14: тоже переключаем прокси перед повтором — раньше повторяли
      // тот же самый URL, что бессмысленно, если сломан именно прокси.
      if (!nativeStarted && currentCh) { _markProxyFailed(); _advanceProxy(); setStatus('errorStream', true); setTimeout(() => init(), 2000); }
    }, 10000);
    _nativeErrorHandler = () => {
      clearTimeout(nativeTimeout);
      video.removeEventListener('loadedmetadata', _nativeMetaHandler); _nativeMetaHandler = null;
      _nativeErrorHandler = null;
      if (currentCh) { _markProxyFailed(); _advanceProxy(); setStatus('errorStream', true); setTimeout(() => init(), 3000); }
    };
    _nativeMetaHandler = () => {
      nativeStarted = true; clearTimeout(nativeTimeout);
      video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null;
      _nativeMetaHandler = null;
    };
    video.addEventListener('error', _nativeErrorHandler, { once: true });
    video.addEventListener('loadedmetadata', _nativeMetaHandler, { once: true });
    video.src=streamUrl; setStatus('connecting'); liveBadge.style.display='flex'; liveBadgeTop.style.display='inline';
    video.play()
      .then(() => {
        nativeStarted = true; clearTimeout(nativeTimeout);
        video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null;
        setStatus('live'); unmuteBtn.style.display=audioOnly?'none':'block'; setupMediaSession(); if(!isIOS())requestWakeLock();
      })
      .catch(() => { setStatus('pressPlay'); });
  }

  // Авторефреш токена каждые 20 минут
  tokenRefreshTimer = setInterval(async () => {
    if (!currentCh) return;
    try {
      const streamUrl = _streamUrl(currentCh);
      const r = await fetch(streamUrl + '&t=' + Date.now(), { cache:'no-store' });
      const ct = r.headers.get('Content-Type') || '';
      if (!ct.includes('mpegurl') && !ct.includes('m3u')) {
        const d = await r.json();
        if (d.url) {
          if (hls) hls.loadSource(d.url);
          if (hlsAudio) hlsAudio.loadSource(d.url);
        }
      }
      // Для прямых m3u8-воркеров hls.js обновляет плейлист сам
    } catch(e) {}
  }, 20 * 60 * 1000);
}

async function init() {
  if (!currentCh) return;
  setStatus('loading'); reloadBtn.style.display='none'; unmuteBtn.style.display='none';
  try {
    const streamUrl = _streamUrl(currentCh);
    const r = await fetch(streamUrl + '&t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const ct = r.headers.get('Content-Type') || '';
    if (ct.includes('mpegurl') || ct.includes('m3u')) {
      // Воркер вернул m3u8 напрямую — URL стрима и есть плейлист
      loadStream(streamUrl);
    } else {
      const d = await r.json();
      if (d.url) loadStream(d.url); else setStatus('errorUrl', true);
    }
  } catch(e) {
    // v82.14: сбой текущего прокси (сеть/HTTP-ошибка) — переключаемся на
    // резервный и пробуем ещё раз, прежде чем показывать ошибку зрителю.
    _markProxyFailed(); _advanceProxy();
    setStatus('errorServer', true);
    setTimeout(() => { if (currentCh) init(); }, 3000);
  }
}

// ── Кнопки ─────────────────────────────────────────────────────────────────
reloadBtn.onclick = () => { userPaused=false; init(); };
unmuteBtn.onclick = () => {
  const ab = document.getElementById('audio-bg');
  if (video.muted) {
    video.muted=false; video.volume=1; userUnmuted=true;
    unmuteBtn.textContent = '🔇 '+t.mute;
    if (ab) { ab.muted=true; ab.pause(); }
  } else {
    video.muted=true; userUnmuted=false;
    unmuteBtn.textContent = '🔊 '+t.unmute;
    if (ab && isIOS()) { ab.muted=false; ab.volume=0; ab.play().catch(()=>{}); }
  }
};
modeBtn.onclick = () => setAudioMode(!audioOnly);

// ── Хаб ───────────────────────────────────────────────────────────────────
function buildHub() {
  channelsGrid.innerHTML = '';
  CHANNEL_GROUPS.forEach(group => {
    const header = document.createElement('div');
    header.className = 'category-header';
    header.textContent = group.label;
    channelsGrid.appendChild(header);

    group.channels.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.style.setProperty('--ch-color', ch.color);
      const iconHtml = ch.logo
        ? `<div class="ch-icon ch-logo"><img src="${ch.logo}" alt="${ch.icon}" loading="lazy" onerror="this.parentElement.outerHTML='&lt;div class=&quot;ch-icon&quot; style=&quot;background:${ch.iconBg};color:${ch.color}&quot;&gt;${ch.icon}&lt;/div&gt;'"></div>`
        : `<div class="ch-icon" style="background:${ch.iconBg};color:${ch.color}">${ch.icon}</div>`;
      card.innerHTML = `
        ${iconHtml}
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
        </div>
        <div class="live-dot"></div>`;
      card.onclick = () => openChannel(ch);
      channelsGrid.appendChild(card);
    });
  });
}

function openChannel(ch) {
  currentCh = ch;
  hubScreen.style.display = 'none';
  playerScreen.style.display = 'flex';
  chTitle.textContent = ch.name;
  liveBadgeTop.style.background = ch.color;
  liveBadge.style.background = ch.color;
  audioOnly = false; document.body.classList.remove('audio-only');
  modeBtn.textContent = t.audioMode;
  _watchdogReconnectCount = 0; // v82.14: новый канал — начинаем счёт сбоев прокси заново

  // v82.24: каналы без прямого CORS-потока (пока только ТНТ) — показываем
  // официальный iframe-embed вместо нашего hls.js-плеера. Прячем все наши
  // элементы управления/статус (плеер OK.ru отдаёт свои) кроме кнопки "назад".
  if (ch.embedUrl) {
    stopStream();
    video.style.display = 'none';
    statusEl.style.display = 'none';
    liveBadge.style.display = 'none';
    reloadBtn.style.display = 'none';
    unmuteBtn.style.display = 'none';
    modeBtn.style.display = 'none';
    fullscreenBtn.style.display = 'none';
    pipBtn.style.display = 'none';
    siteLinkBtn.style.display = 'none';
    channelIframe.src = ch.embedUrl;
    channelIframe.style.display = 'block';
    return;
  }
  video.style.display = '';
  statusEl.style.display = '';
  modeBtn.style.display = '';
  fullscreenBtn.style.display = '';
  siteLinkBtn.style.display = '';
  channelIframe.style.display = 'none';
  channelIframe.src = '';
  stopStream(); init();
}

function goToHub() {
  stopStream();
  channelIframe.src = ''; // остановить embed OK.ru, если был открыт
  channelIframe.style.display = 'none';
  playerScreen.style.display = 'none';
  hubScreen.style.display = 'flex';
  currentCh = null;
}

backBtn.onclick = () => goToHub();

buildHub();
</script>
</body>
